name: Sporttery SP Cloud Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 0-9 * * *'
    - cron: '*/15 10-23 * * *'

permissions:
  contents: write

concurrency:
  group: sporttery-sp-cloud
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch official Sporttery SP with Chromium
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import json
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from playwright.async_api import async_playwright

          ROOT = Path("data/cloud_sp")
          ROOT.mkdir(parents=True, exist_ok=True)

          PAGES = [
              "https://www.sporttery.cn/jc/jsq/zqspf/index.html",
              "https://www.sporttery.cn/jc/jsq/zqbf/index.html",
              "https://www.sporttery.cn/jc/jsq/zqzjqs/index.html",
              "https://www.sporttery.cn/jc/jsq/zqbqc/index.html",
          ]

          API_TOKEN = "getMatchCalculatorV1.qry"
          TARGET_POOLS = {"had", "hhad", "crs", "ttg", "hafu"}
          captured = []
          raw_bodies = []

          def merge_match(dst, src):
              metadata = [
                  "matchId", "matchNum", "matchNumStr", "matchWeek",
                  "businessDate", "matchDate", "matchTime",
                  "leagueAbbName", "leagueAllName",
                  "homeTeamAbbName", "homeTeamAllName",
                  "awayTeamAbbName", "awayTeamAllName",
                  "sellStatus", "matchStatus",
              ]
              for key in metadata:
                  value = src.get(key)
                  if value not in (None, ""):
                      dst[key] = value
              for market in TARGET_POOLS:
                  value = src.get(market)
                  if isinstance(value, dict) and value:
                      dst[market] = value

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-dev-shm-usage"],
                  )
                  context = await browser.new_context(
                      locale="zh-CN",
                      timezone_id="Asia/Shanghai",
                      viewport={"width": 1440, "height": 1000},
                      user_agent=(
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/140.0.0.0 Safari/537.36"
                      ),
                  )
                  page = await context.new_page()

                  async def on_response(response):
                      if API_TOKEN not in response.url:
                          return
                      if response.status != 200:
                          print("API response status:", response.status, response.url)
                          return
                      try:
                          text = await response.text()
                          payload = json.loads(text)
                      except Exception as exc:
                          print("Failed to parse API response:", exc)
                          return
                      if not payload.get("success"):
                          print("Official API returned success=false")
                          return
                      raw_bodies.append(text.encode("utf-8"))
                      captured.append({"url": response.url, "payload": payload})
                      print("Captured:", response.url)

                  page.on("response", on_response)

                  for url in PAGES:
                      print("Opening:", url)
                      try:
                          await page.goto(url, wait_until="domcontentloaded", timeout=60000)
                          await page.wait_for_timeout(7000)
                      except Exception as exc:
                          print("Page load warning:", url, exc)

                  await page.wait_for_timeout(3000)
                  await browser.close()

          asyncio.run(main())

          if not captured:
              raise RuntimeError(
                  "No official getMatchCalculatorV1.qry responses were captured."
              )

          matches = {}
          for item in captured:
              payload = item["payload"]
              groups = ((payload.get("value") or {}).get("matchInfoList") or [])
              for group in groups:
                  for m in group.get("subMatchList") or []:
                      mid = str(m.get("matchId") or "")
                      if not mid:
                          continue
                      dst = matches.setdefault(mid, {})
                      merge_match(dst, m)

          if not matches:
              raise RuntimeError(
                  "Official responses were captured but no matches were parsed."
              )

          now = datetime.now(timezone.utc)
          china_now = now.astimezone(ZoneInfo("Asia/Shanghai"))
          raw_sha = hashlib.sha256(b"\n".join(raw_bodies)).hexdigest()

          markets_only = {
              mid: {
                  market: matches[mid].get(market, {})
                  for market in sorted(TARGET_POOLS)
              }
              for mid in sorted(matches)
          }

          fingerprint = hashlib.sha256(
              json.dumps(
                  markets_only,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
          ).hexdigest()

          latest_path = ROOT / "latest.json"
          previous = {}
          if latest_path.exists():
              try:
                  previous = json.loads(latest_path.read_text(encoding="utf-8"))
              except Exception:
                  previous = {}

          changed = previous.get("market_fingerprint") != fingerprint
          heartbeat_due = True
          if previous.get("observed_at"):
              try:
                  old = datetime.fromisoformat(
                      previous["observed_at"].replace("Z", "+00:00")
                  )
                  heartbeat_due = (now - old).total_seconds() >= 3600
              except Exception:
                  pass

          if not changed and not heartbeat_due:
              print("No SP change and no hourly heartbeat needed.")
              raise SystemExit(0)

          market_coverage = {
              market: sum(
                  1 for m in matches.values()
                  if isinstance(m.get(market), dict) and m.get(market)
              )
              for market in sorted(TARGET_POOLS)
          }

          doc = {
              "schema": "jczq.sporttery.cloud-feed.v2",
              "source": "sporttery_official_chromium",
              "official": True,
              "observed_at": now.isoformat().replace("+00:00", "Z"),
              "observed_at_cst": china_now.isoformat(),
              "raw_sha256": raw_sha,
              "market_fingerprint": fingerprint,
              "match_count": len(matches),
              "market_coverage": market_coverage,
              "matches": [matches[mid] for mid in sorted(matches)],
          }

          latest_path.write_text(
              json.dumps(doc, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          business_dates = sorted({
              str(m.get("businessDate"))
              for m in matches.values()
              if m.get("businessDate")
          })
          business_date = (
              business_dates[-1]
              if business_dates
              else china_now.date().isoformat()
          )

          history_dir = ROOT / "history" / business_date
          history_dir.mkdir(parents=True, exist_ok=True)

          if changed:
              stamp = china_now.strftime("%Y%m%d-%H%M%S")
              snapshot_path = history_dir / f"{stamp}.json"
              snapshot_path.write_text(
                  json.dumps(doc, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          timeline_path = ROOT / "timeline" / f"{business_date}.jsonl"
          timeline_path.parent.mkdir(parents=True, exist_ok=True)
          with timeline_path.open("a", encoding="utf-8") as f:
              f.write(json.dumps({
                  "observed_at": doc["observed_at"],
                  "observed_at_cst": doc["observed_at_cst"],
                  "market_fingerprint": fingerprint,
                  "raw_sha256": raw_sha,
                  "match_count": len(matches),
                  "market_coverage": market_coverage,
                  "changed": changed,
              }, ensure_ascii=False) + "\n")

          print(
              f"Captured {len(matches)} official matches; "
              f"coverage={market_coverage}; changed={changed}"
          )
          PY

      - name: Commit official SP feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cloud_sp

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "data: update official Sporttery SP"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
